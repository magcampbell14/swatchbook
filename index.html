<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Swatch Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="swatchbook" />
<meta name="theme-color" content="#F5F1E8" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" href="./apple-touch-icon.png" />
<link rel="manifest" href="./manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Swatch Book v2 — warm off-white "paper" so marker colors read the way they do on a page.
   iOS invariants (see PROJECT-NOTES §3): dvh with vh fallback, safe-area padding, overscroll containment. */
:root{
  --paper:#F5F1E8; --card:#FBF9F4; --line:#E3DCCD; --ink:#2B2622; --muted:#6B6359;
  --accent:#B4472F; --low:#C98A1B; --out:#B4472F; --white:#FFFDF8;
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--paper);}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
button{font-family:inherit;cursor:pointer;color:inherit;}
button:disabled{cursor:default;opacity:.45;}
input{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.sm{font-size:.8rem;} .wide{width:100%;}
.sb-muted{color:var(--muted);}

/* ---- frame ---- */
.app{max-width:1100px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;}
.sb-screen{padding:calc(18px + var(--safe-t)) 20px calc(var(--nav-h) + var(--safe-b) + 28px);}
.sb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 12px;}
.sb-h1{font-family:Fredoka,Inter,sans-serif;font-weight:600;font-size:32px;margin:0;letter-spacing:-.2px;}
.sb-h2{font-family:Fredoka,Inter,sans-serif;font-weight:600;font-size:20px;margin:0;flex:1;}
.sb-label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px;}
.sb-label .sb-muted{text-transform:none;letter-spacing:0;font-weight:500;}
.sb-eyebrow{font-size:.75rem;color:var(--muted);font-weight:500;}
.sb-empty{color:var(--muted);text-align:center;padding:22px 12px;font-size:.92rem;}
.sb-hint{color:var(--muted);font-size:.8rem;text-align:center;margin:22px 0 0;}
.sb-err{color:var(--accent);font-size:.9rem;margin:6px 0;}

/* ---- nav ---- */
.sb-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);}
.sb-nav-in{display:flex;width:100%;max-width:520px;}
.sb-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border:none;background:none;
  color:var(--muted);font-size:12px;font-weight:500;min-height:var(--nav-h);}
.sb-nav button.on{color:var(--accent);font-weight:600;}

/* ---- buttons ---- */
.sb-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;
  border:1.5px solid transparent;font-size:15px;font-weight:600;background:transparent;}
.sb-btn.wide{display:flex;margin-top:14px;}
.sb-btn-ink{background:var(--ink);color:var(--paper);}
.sb-btn-line{border-color:var(--line);background:var(--card);border-radius:14px;}
.sb-btn.danger{color:var(--accent);}
.sb-btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;}
.sb-btnrow .sb-btn{flex:1;}
.sb-iconbtn{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:12px;}
.sb-pillbtn{height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;flex:0 0 auto;}
.sb-link{display:block;margin:14px auto 0;background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;padding:10px;}

/* ---- inputs ---- */
.sb-search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--muted);}
.sb-search input{flex:1;border:none;background:transparent;font-size:16px;color:var(--ink);outline:none;min-width:0;}
.sb-clear{border:none;background:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.sb-field{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px;}
.sb-field input{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--white);padding:0 12px;font-size:16px;color:var(--ink);}
.sb-range{width:100%;accent-color:var(--ink);}
.sb-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500;margin-top:14px;min-height:44px;}
.sb-toggle input{width:22px;height:22px;accent-color:var(--ink);}
.sb-seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);}
.sb-seg button{border:none;background:none;padding:0 12px;min-height:38px;font-size:13px;font-weight:600;color:var(--muted);}
.sb-seg button.on{background:var(--ink);color:var(--paper);}
.sb-seg button.on.low{background:var(--low);color:#fff;}
.sb-seg button.on.out{background:var(--out);color:#fff;}
.sb-stepper{display:inline-flex;align-items:center;gap:10px;font-weight:600;}
.sb-stepper button{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:18px;}

/* ---- swatches ---- */
.sb-chip{display:block;flex:0 0 auto;position:relative;border:1px solid rgba(43,38,34,.13);padding:0;}
.sb-chip.ring{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);}
.sb-chip.dim{opacity:.4;}
.sb-dot{position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:6px;border:2px solid var(--white);}
.sb-dot.low{background:var(--low);} .sb-dot.out{background:var(--out);}
.sb-badge{position:absolute;bottom:4px;right:5px;font-size:10px;font-weight:600;background:rgba(255,253,248,.88);color:var(--ink);padding:1px 5px;border-radius:6px;}
.sb-strip{display:flex;gap:3px;} .sb-strip span{width:16px;height:16px;border-radius:4px;border:1px solid rgba(43,38,34,.12);}
.sb-strip.lg span{flex:1;height:30px;border-radius:7px;} .sb-strip.sm span{width:13px;height:13px;}
.sb-mini{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(43,38,34,.12);}

/* ---- grids ---- */
.sb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:12px 10px;}
.sb-grid-sm{margin-top:12px;}
.sb-tile{display:flex;flex-direction:column;gap:3px;padding:0;border:none;background:none;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.sb-tile-sw{position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:12px;border:1px solid rgba(43,38,34,.13);}
.sb-tile-sw.dim{opacity:.4;}
.sb-tile-code{font-size:12px;font-weight:600;}
.sb-tile-old{font-size:11px;color:var(--muted);margin-top:-3px;}
.sb-filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none;}
.sb-filters::-webkit-scrollbar{display:none;}
.sb-fchip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:transparent;font-size:13px;font-weight:600;}
.sb-fchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.sb-count{color:var(--accent);} .sb-fchip.on .sb-count{color:#F3B8A8;}

/* ---- rows / lists ---- */
.sb-row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;}
.sb-row.static{cursor:default;}
.sb-row-txt{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;}
.sb-row-txt b{font-size:15px;}
.sb-restock{display:flex;flex-direction:column;gap:2px;margin-top:10px;}
.sb-restock .sb-btn{align-self:flex-start;margin-bottom:8px;}
.sb-stack{display:flex;flex-direction:column;gap:10px;}
.sb-option{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;text-align:left;width:100%;}
.sb-option-ic{width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;}
.sb-option-txt{display:flex;flex-direction:column;gap:2px;} .sb-option-txt b{font-size:16px;} .sb-option-txt span{font-size:13px;color:var(--muted);}
.sb-moodrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);}
.sb-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;}
.sb-pallist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.sb-palcard{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;}
.sb-palcard-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.sb-list{margin-top:6px;}

/* ---- pages home ---- */
.sb-pagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.sb-pagecard{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;}
.sb-pagecard-img{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--white);aspect-ratio:5/6;}
.sb-thumb-cv{width:100%;height:100%;object-fit:contain;display:block;}
.sb-pagecard-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:14px;}
.sb-star{font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap;}
.sb-addcard{align-items:center;justify-content:center;min-height:220px;border-style:dashed;border-width:1.5px;background:transparent;color:var(--muted);font-weight:500;}
.sb-emptycard{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:44px 20px;border:1.5px dashed var(--line);border-radius:18px;background:transparent;color:var(--ink);text-align:center;margin-top:8px;}
.sb-emptycard span{color:var(--muted);font-size:14px;}

/* ---- editor ---- */
.sb-editor{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;max-width:1100px;margin:0 auto;
  height:100vh;height:100dvh;padding-top:var(--safe-t);}
.sb-ed-top{display:flex;align-items:center;gap:2px;padding:6px 8px 0;}
.sb-ed-title{font-family:Fredoka,Inter,sans-serif;font-weight:600;font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-versions{display:flex;gap:8px;padding:6px 16px 8px;overflow-x:auto;scrollbar-width:none;}
.sb-versions::-webkit-scrollbar{display:none;}
.sb-vpill{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--line);background:transparent;font-size:13px;font-weight:600;}
.sb-vpill.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.sb-vpill.add{width:40px;padding:0;display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--muted);}
.sb-canvas-wrap{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;margin:0 10px;border-radius:14px;background:#EFEADF;}
.sb-view{position:absolute;left:0;top:0;transform-origin:0 0;touch-action:none;box-shadow:0 2px 14px rgba(43,38,34,.1);}
.sb-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;}
.sb-fitbtn{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(251,249,244,.92);display:flex;align-items:center;justify-content:center;}
.sb-dock{background:var(--card);border-top:1px solid var(--line);padding:10px 0 calc(10px + var(--safe-b));margin-top:10px;}
.sb-dock-sel{display:flex;align-items:center;gap:10px;padding:0 16px 10px;min-height:44px;}
.sb-dock-code{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-tray{display:flex;gap:12px;padding:4px 16px;overflow-x:auto;scrollbar-width:none;}
.sb-tray::-webkit-scrollbar{display:none;}
.sb-pot{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:12px;border:1px solid rgba(43,38,34,.13);padding:0;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.sb-pot.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink);}
.sb-pot.add{border:1.5px dashed var(--line);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.sb-suggest{display:flex;align-items:center;gap:8px;padding:10px 16px 0;overflow-x:auto;white-space:nowrap;scrollbar-width:none;}
.sb-sugg{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px 0 6px;border-radius:16px;border:1px solid var(--line);background:var(--white);font-size:12px;font-weight:600;flex:0 0 auto;}
.sb-sugg.more{padding:0 12px;color:var(--accent);}
.sb-sugg span{width:18px;height:18px;border-radius:5px;border:1px solid rgba(43,38,34,.12);}

/* ---- sheets ---- */
.sb-sheet-wrap{position:fixed;inset:0;z-index:50;}
.sb-scrim{position:absolute;inset:0;background:rgba(43,38,34,.32);animation:sbfade .15s ease-out;}
.sb-sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;background:var(--paper);border-radius:22px 22px 0 0;
  box-shadow:0 -8px 30px rgba(43,38,34,.16);max-height:85vh;max-height:85dvh;display:flex;flex-direction:column;animation:sbup .2s ease-out;}
.sb-sheet.tall{height:92vh;height:92dvh;max-height:92dvh;}
.sb-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 2px;flex:0 0 auto;}
.sb-sheet-head{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 20px;flex:0 0 auto;}
.sb-sheet-body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 20px calc(24px + var(--safe-b));flex:1;}
@keyframes sbup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes sbfade{from{opacity:0}to{opacity:1}}
.sb-menu{display:flex;flex-direction:column;margin:8px 0;}
.sb-menu button{display:flex;align-items:center;gap:12px;min-height:48px;border:none;border-bottom:1px solid var(--line);background:none;font-size:15px;font-weight:500;text-align:left;padding:0 2px;}
.sb-menu button.danger{color:var(--accent);}

/* ---- shade card ---- */
.sb-shade-base{display:flex;align-items:center;gap:14px;padding:4px 0 6px;}
.sb-shade-base-txt{display:flex;flex-direction:column;gap:1px;}
.sb-shade-code{font-size:20px;font-weight:600;}
.sb-rec{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;border:none;background:none;text-align:left;}
.sb-rec:disabled{opacity:1;cursor:default;}
.sb-rec-txt{display:flex;flex-direction:column;flex:1;} .sb-rec-txt b{font-size:15px;} .sb-rec-txt span{font-size:13px;color:var(--muted);}
.sb-rec-use{font-size:13px;font-weight:600;color:var(--accent);padding:6px 10px;}

/* ---- new version ---- */
.sb-schemes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.sb-scheme{display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:left;}
.sb-scheme-img{position:relative;display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--white);aspect-ratio:5/6;}
.sb-scheme-img img{width:100%;height:100%;object-fit:contain;display:block;}
@media (min-width:700px){ .sb-schemes{grid-template-columns:repeat(4,minmax(0,1fr));} }

/* ---- coloring mode ---- */
.sb-colormode{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;padding-top:var(--safe-t);height:100vh;height:100dvh;}
.sb-colormode .sb-ed-top{padding:8px 16px 8px 12px;}
.sb-cm-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(24px + var(--safe-b));display:flex;flex-direction:column;gap:6px;}
.sb-cm-img{width:100%;max-height:58vh;max-height:58dvh;object-fit:contain;border-radius:14px;border:1px solid var(--line);background:var(--white);}
.sb-cm-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
.sb-cm-txt{display:flex;flex-direction:column;flex:1;min-width:0;} .sb-cm-txt b{font-size:15px;}
.sb-cm-shadow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;}
.sb-flag{font-size:10px;font-weight:700;margin-left:8px;padding:2px 6px;border-radius:6px;color:#fff;vertical-align:2px;}
.sb-flag.low{background:var(--low);} .sb-flag.out{background:var(--out);}
@media (min-width:900px){ .sb-cm-body{flex-direction:row;align-items:flex-start;gap:24px;} .sb-cm-img{flex:1.3;max-height:84dvh;} .sb-cm-list{flex:1;} }

/* ---- markers detail ---- */
.sb-md-top{display:flex;gap:16px;align-items:center;margin-bottom:6px;}
.sb-md-sw{width:84px;height:84px;border-radius:18px;border:1px solid rgba(43,38,34,.13);flex:0 0 auto;}
.sb-md-txt{display:flex;flex-direction:column;gap:3px;} .sb-md-name{font-size:18px;}
.sb-copy{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;font-weight:500;}

/* ---- palettes tools ---- */
.sb-photo{width:100%;max-height:240px;object-fit:cover;border-radius:14px;border:1px solid var(--line);margin-bottom:12px;}
.sb-ends{display:flex;align-items:center;gap:8px;}
.sb-end{flex:1;display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;}
.sb-end span{display:flex;flex-direction:column;}
.sb-ramp{display:flex;height:36px;border-radius:10px;overflow:hidden;margin:16px 0 4px;border:1px solid var(--line);}
.sb-ramp span{flex:1;}

/* ---- palettes around a color ---- */
.sb-around{padding:14px 0;border-bottom:1px solid var(--line);}
.sb-around-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
.sb-around-chips{display:flex;gap:8px;flex-wrap:wrap;}
.sb-around-chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:48px;font-weight:600;}
.sb-around-sw{width:44px;height:44px;border-radius:12px;border:1px solid rgba(43,38,34,.13);}
.sb-around-chip.anchor .sb-around-sw{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);}
.sb-dock-sel .sb-pillbtn+.sb-pillbtn{margin-left:-2px;}

/* ---- start sheet preview ---- */
.sb-startprev{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.sb-startprev img{width:96px;height:116px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:var(--white);flex:0 0 auto;}
.sb-startprev-txt{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}

/* ---- backup ---- */
.sb-backup{margin-top:28px;}
.sb-restore{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:14px;}

/* ---- toast ---- */
.sb-toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(43,38,34,.25);max-width:88vw;}
.sb-editor .sb-toast{bottom:calc(150px + var(--safe-b));}

/* shuffle & tune */
.sb-pillbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.sb-pillbtn:disabled,.sb-btn:disabled{opacity:.45;}
.sb-scrollrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.sb-scrollrow::-webkit-scrollbar{display:none;}
.sb-tuner-back{display:flex;align-items:center;gap:4px;margin:0 0 8px;padding:6px 0;}
.sb-tuner-blurb{margin:8px 0 10px;}
.sb-tuner-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;}
.sb-tchip{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:0;color:var(--ink);text-align:center;min-width:0;}
.sb-tchip-sw{position:relative;width:100%;aspect-ratio:1;border-radius:16px;border:1px solid rgba(43,38,34,.13);}
.sb-tchip.locked .sb-tchip-sw{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);}
.sb-tchip-lock{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;}
.sb-tchip b{font-size:13px;margin-top:4px;} .sb-tchip .sm{color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.sb-tuner-main{margin-top:14px;}
.sb-nudges{display:flex;flex-wrap:wrap;gap:8px;}
.sb-label .sb-link{display:inline;margin:0 0 0 6px;padding:0;text-transform:none;letter-spacing:0;}
.sb-tuner-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;}
.sb-viberow{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding-right:4px;}
.sb-viberow-main{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:none;border:none;text-align:left;color:var(--ink);}
.sb-viberow-txt{display:flex;flex-direction:column;min-width:0;}
.sb-viberow-txt .sm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-spin{color:var(--muted);}
.sb-around-head .sb-spin{margin-left:auto;width:36px;height:36px;}
.sb-around-head{align-items:center;}
.sb-scheme{position:relative;}
.sb-scheme-pick{display:flex;flex-direction:column;gap:5px;background:none;border:none;padding:0;text-align:left;color:var(--ink);width:100%;}
.sb-scheme-img.busy img{opacity:.55;}
.sb-scheme-spin{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);}
@media (max-width:420px){ .sb-viberow .sb-strip span{width:13px;height:13px;} }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- data + color engine -->
<script src="inventory.js"></script>
<script src="cq-engine.js"></script>

<!-- shared helpers (storage, merged inventory, codes) + v2 screens -->
<script type="text/babel" data-presets="react" src="cq-ui.jsx"></script>
<script type="text/babel" data-presets="react" src="sb-core.jsx"></script>
<script type="text/babel" data-presets="react" src="sb-palette.jsx"></script>
<script type="text/babel" data-presets="react" src="sb-pages.jsx"></script>
<script type="text/babel" data-presets="react" src="sb-markers.jsx"></script>
<script type="text/babel" data-presets="react" src="sb-palettes.jsx"></script>

<script type="text/babel" data-presets="react">
(function(){
  const { Icon } = window.SB;
  // Shelved (code + saved data kept): Prompts, Studio, Learn — cq-ask/cq-learn/cq-studio/cq-screens/cq-palettes/cq-pages.jsx
  const TABS=[["pages","pages","Pages"],["markers","markers","Markers"],["palettes","palettes","Palettes"]];
  function App(){
    const [tab,setTab]=window.useLocal("sb-tab","pages");
    const [seed,setSeed]=React.useState(null);
    const cur=TABS.some(t=>t[0]===tab)?tab:"pages";
    return (
      <div className="app">
        {cur==="pages" && <window.PagesScreenV2/>}
        {cur==="markers" && <window.MarkersScreenV2 onBlend={u=>{ setSeed(u); setTab("palettes"); }}/>}
        {cur==="palettes" && <window.PalettesScreenV2 betweenSeed={seed} clearSeed={()=>setSeed(null)}/>}
        <nav className="sb-nav" aria-label="Main"><div className="sb-nav-in">
          {TABS.map(([id,ic,lbl])=>(
            <button key={id} className={cur===id?"on":""} aria-current={cur===id?"page":undefined} onClick={()=>{ setTab(id); window.scrollTo(0,0); }}>
              <Icon n={ic} size={24}/><span>{lbl}</span>
            </button>
          ))}
        </div></nav>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
})();
</script>

<!-- PWA: offline service worker -->
<script>
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
